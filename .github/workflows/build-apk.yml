name: Build Android APK (C++ NDK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Setup NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPSClash-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RPSClash-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)

          cat << 'EOF' > release_notes.md
          ### 🚀 RPS Clash (Batu Gunting Kertas) - Official Release v1.0.0

          ### 📦 Unduh File APK:
          - **app-release.apk** (⭐ Signed Production Release APK)
          - **app-debug.apk** (Debug Build)

          ### 🌟 Fitur Utama:
          - **Core C++20 Game Engine & NDK** (`libgamecore.so`)
          - **AI Adaptif**: Mudah, Normal (*Win-Stay Lose-Shift*), dan Hard (*Markov Chain N-Gram*)
          - **Real-Time Online Multiplayer** via WebSocket
          - **Sistem Audio Synthesized & Subtle Haptics**
          - **Statistik Persisten Lokal** (VS AI & Online)
          - **Support Semua Android** (Android 5.0 Lollipop hingga Android 15+)
          EOF

          gh release delete v1.0.0 --yes --cleanup-tag --repo ${{ github.repository }} 2>/dev/null || true

          gh release create v1.0.0 $RELEASE_APK $DEBUG_APK \
            --title "RPS Clash v1.0.0 (Official Signed Release APK)" \
            --notes-file release_notes.md \
            --repo ${{ github.repository }}
